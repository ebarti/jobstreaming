[build-system]
requires = ["poetry-core>=2.0"]
build-backend = "poetry.core.masonry.api"

[project]
name = "jobctrl-jobstream"
version = "2.0.0a1"
description = "Concurrent, resumable job search streams with a DataFrame batch API"
authors = [{ name = "JobStream contributors" }]
license = "MIT"
readme = "README.md"
requires-python = ">=3.10,<4.0"
dependencies = [
    "requests>=2.31.0,<3.0.0",
    "beautifulsoup4>=4.12.2,<5.0.0",
    "pandas>=2.1.0,<3.0.0",
    "pydantic>=2.3.0,<3.0.0",
    "tls-client>=1.0.1,<2.0.0",
    "markdownify>=1.1.0,<2.0.0",
]
keywords = [
    "jobs-scraper",
    "streaming",
    "linkedin",
    "indeed",
    "glassdoor",
    "ziprecruiter",
]
classifiers = [
    "Development Status :: 3 - Alpha",
    "Programming Language :: Python :: 3",
    "Programming Language :: Python :: 3.10",
    "Programming Language :: Python :: 3.11",
    "Programming Language :: Python :: 3.12",
    "Programming Language :: Python :: 3.13",
]

[tool.poetry]
[[tool.poetry.packages]]
include = "jobstream"

[tool.black]
line-length = 88
target-version = ["py310", "py311", "py312"]

[tool.ruff]
line-length = 88
target-version = "py310"

[tool.ruff.lint]
select = ["E4", "E7", "E9", "F", "I", "B", "UP", "SIM"]

[tool.pytest.ini_options]
addopts = "-ra"
testpaths = ["tests"]

[tool.poetry.group.dev.dependencies]
black = ">=24.0"
pre-commit = ">=3.0"
pytest = ">=8.0"
ruff = ">=0.9"
