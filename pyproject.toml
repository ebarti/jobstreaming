[build-system]
requires = ["poetry-core>=2.0"]
build-backend = "poetry.core.masonry.api"

[project]
name = "jobstreaming"
version = "0.0.3"
description = "Stream normalized jobs from multiple boards with typed events and durable checkpoints"
authors = [{ name = "JobStreaming contributors" }]
license = "MIT"
readme = "README.md"
requires-python = ">=3.10,<4.0"
dependencies = [
    "requests>=2.31.0,<3.0.0",
    "beautifulsoup4>=4.12.2,<5.0.0",
    "pydantic>=2.3.0,<3.0.0",
    "tls-client>=1.0.1,<2.0.0",
    "markdownify>=1.1.0,<2.0.0",
]
keywords = [
    "job-search",
    "job-boards",
    "jobs-scraper",
    "streaming",
    "resumable",
    "data-pipeline",
    "linkedin",
    "indeed",
    "glassdoor",
    "ziprecruiter",
]
classifiers = [
    "Development Status :: 3 - Alpha",
    "Programming Language :: Python :: 3",
    "Programming Language :: Python :: 3.10",
    "Programming Language :: Python :: 3.11",
    "Programming Language :: Python :: 3.12",
    "Programming Language :: Python :: 3.13",
    "Programming Language :: Python :: 3.14",
]

[project.optional-dependencies]
batch = ["pandas>=2.1.0,<3.0.0"]

[project.urls]
Homepage = "https://github.com/ebarti/jobstreaming"
Repository = "https://github.com/ebarti/jobstreaming"
Issues = "https://github.com/ebarti/jobstreaming/issues"
Changelog = "https://github.com/ebarti/jobstreaming/blob/main/CHANGELOG.md"
Security = "https://github.com/ebarti/jobstreaming/security/policy"
Support = "https://github.com/ebarti/jobstreaming/issues"

[tool.poetry]
include = [
    { path = "CHANGELOG.md", format = "sdist" },
    { path = "CONTRIBUTING.md", format = "sdist" },
    { path = "SECURITY.md", format = "sdist" },
]

[[tool.poetry.packages]]
include = "jobstreaming"

[tool.black]
line-length = 88
target-version = ["py310", "py311", "py312", "py313", "py314"]

[tool.ruff]
line-length = 88
target-version = "py310"

[tool.ruff.lint]
select = ["E4", "E7", "E9", "F", "I", "B", "UP", "SIM"]

[tool.pytest.ini_options]
addopts = "-ra"
testpaths = ["tests"]

[tool.coverage.run]
source = ["jobstreaming"]

[tool.coverage.report]
show_missing = true
skip_covered = true

[tool.mypy]
python_version = "3.10"
files = [
    "jobstreaming/__init__.py",
    "jobstreaming/model.py",
    "jobstreaming/protocols.py",
    "jobstreaming/registry.py",
    "jobstreaming/events.py",
    "jobstreaming/checkpoint.py",
    "jobstreaming/context.py",
    "jobstreaming/runtime.py",
    "jobstreaming/testing.py",
    "jobstreaming/api.py",
    "jobstreaming/batch.py",
    "jobstreaming/exception.py",
    "jobstreaming/result.py",
    "tests/typing/adapter_sdk_contract.py",
]
ignore_missing_imports = true
check_untyped_defs = true
disallow_any_generics = true
no_implicit_optional = true
strict_equality = true
warn_return_any = true
warn_unused_ignores = true
warn_unused_configs = true

[tool.poetry.group.dev.dependencies]
black = ">=24.0"
mypy = ">=1.15"
pre-commit = ">=3.0"
pytest = ">=8.0"
pytest-cov = ">=6.0"
ruff = ">=0.9"
