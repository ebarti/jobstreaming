name: Release

on:
  push:
    tags:
      - "v*"

permissions:
  contents: read

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
      - name: Check out source
        uses: actions/checkout@df4cb1c069e1874edd31b4311f1884172cec0e10 # v6

      - name: Set up Python
        uses: actions/setup-python@ece7cb06caefa5fff74198d8649806c4678c61a1 # v6
        with:
          python-version: "3.14"
          cache: pip

      - name: Install Poetry
        run: python -m pip install poetry==2.4.1

      - name: Install and verify project
        run: |
          poetry install --all-extras --no-interaction
          poetry check --lock
          poetry run pytest
          poetry run ruff check jobstreaming tests scripts
          poetry run mypy
          poetry run black --check jobstreaming tests scripts

      - name: Verify tag matches package version
        run: test "${GITHUB_REF_NAME#v}" = "$(poetry version --short)"

      - name: Build distributions
        run: poetry build

      - name: Verify optional dependency metadata
        run: python scripts/verify_batch_artifact.py dist/jobstreaming-*.whl

      - name: Verify wheel through an isolated consumer install
        shell: bash
        run: |
          consumer="${RUNNER_TEMP}/jobstreaming-wheel-consumer"
          python -m venv "$consumer"
          "$consumer/bin/python" -m pip install --disable-pip-version-check dist/jobstreaming-*.whl
          observed="$("$consumer/bin/python" -c 'from importlib.metadata import version; print(version("jobstreaming"))')"
          test "$observed" = "${GITHUB_REF_NAME#v}"
          cd "$RUNNER_TEMP"
          "$consumer/bin/python" "${GITHUB_WORKSPACE}/scripts/verify_sdk_install.py"
          "$consumer/bin/python" "${GITHUB_WORKSPACE}/scripts/verify_streaming_install.py"

      - name: Verify source distribution through an isolated consumer install
        shell: bash
        run: |
          consumer="${RUNNER_TEMP}/jobstreaming-sdist-consumer"
          python -m venv "$consumer"
          "$consumer/bin/python" -m pip install --disable-pip-version-check dist/jobstreaming-*.tar.gz
          observed="$("$consumer/bin/python" -c 'from importlib.metadata import version; print(version("jobstreaming"))')"
          test "$observed" = "${GITHUB_REF_NAME#v}"
          cd "$RUNNER_TEMP"
          "$consumer/bin/python" "${GITHUB_WORKSPACE}/scripts/verify_sdk_install.py"
          "$consumer/bin/python" "${GITHUB_WORKSPACE}/scripts/verify_streaming_install.py"

      - name: Upload distributions
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7
        with:
          name: jobstreaming-${{ github.ref_name }}
          path: dist/
          if-no-files-found: error
          retention-days: 14

  publish-pypi:
    needs: build
    runs-on: ubuntu-latest
    environment:
      name: pypi
      url: https://pypi.org/p/jobstreaming
    permissions:
      id-token: write

    steps:
      - name: Download distributions
        uses: actions/download-artifact@3e5f45b2cfb9172054b4087a40e8e0b5a5461e7c # v8
        with:
          name: jobstreaming-${{ github.ref_name }}
          path: dist/

      - name: Publish to PyPI with trusted publishing
        uses: pypa/gh-action-pypi-publish@cef221092ed1bacb1cc03d23a2d87d1d172e277b # release/v1

  publish-github:
    needs: publish-pypi
    runs-on: ubuntu-latest
    permissions:
      contents: write

    steps:
      - name: Download distributions
        uses: actions/download-artifact@3e5f45b2cfb9172054b4087a40e8e0b5a5461e7c # v8
        with:
          name: jobstreaming-${{ github.ref_name }}
          path: dist/

      - name: Publish pinned GitHub release
        env:
          GH_TOKEN: ${{ github.token }}
        run: >-
          gh release create "$GITHUB_REF_NAME" dist/*
          --repo "$GITHUB_REPOSITORY"
          --verify-tag
          --generate-notes
          --title "JobStreaming $GITHUB_REF_NAME"
