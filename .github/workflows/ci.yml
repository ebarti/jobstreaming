name: CI

on:
  push:
    branches:
      - main
  pull_request:

permissions:
  contents: read

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  test:
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        python-version: ["3.10", "3.11", "3.12", "3.13", "3.14"]

    steps:
      - name: Check out source
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v6
        with:
          persist-credentials: false

      - name: Set up Python
        uses: actions/setup-python@ece7cb06caefa5fff74198d8649806c4678c61a1 # v6
        with:
          python-version: ${{ matrix.python-version }}
          cache: pip

      - name: Install Poetry
        run: python -m pip install poetry==2.4.1

      - name: Install project
        run: poetry install --all-extras --no-interaction

      - name: Validate lock file
        run: poetry check --lock

      - name: Run tests
        run: poetry run pytest --cov --cov-report=term-missing

      - name: Enforce adapter coverage ratchets
        run: poetry run python scripts/check_coverage.py

      - name: Run Ruff
        run: poetry run ruff check jobstreaming tests scripts

      - name: Type-check adapter SDK and runtime contracts
        run: poetry run mypy

      - name: Check formatting
        run: poetry run black --check jobstreaming tests scripts

  build:
    needs: test
    runs-on: ubuntu-latest

    steps:
      - name: Check out source
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v6
        with:
          persist-credentials: false

      - name: Set up Python
        uses: actions/setup-python@ece7cb06caefa5fff74198d8649806c4678c61a1 # v6
        with:
          python-version: "3.14"
          cache: pip

      - name: Install Poetry
        run: python -m pip install poetry==2.4.1

      - name: Build distributions
        run: poetry build

      - name: Verify installed wheel and source distribution
        run: >-
          python scripts/verify_release_artifacts.py
          --expected-version "$(poetry version --short)"
          --dist-dir dist

      - name: Verify SDK, typing, and batch wheel consumers
        shell: bash
        run: |
          wheel=("${GITHUB_WORKSPACE}"/dist/jobstreaming-*.whl)
          python scripts/verify_batch_artifact.py "${wheel[0]}"

          streaming_consumer="${RUNNER_TEMP}/jobstreaming-streaming-consumer"
          python -m venv "$streaming_consumer"
          "$streaming_consumer/bin/python" -m pip install --disable-pip-version-check mypy==1.15.0 "${wheel[0]}"
          cd "$RUNNER_TEMP"
          "$streaming_consumer/bin/python" "${GITHUB_WORKSPACE}/scripts/verify_streaming_install.py"
          "$streaming_consumer/bin/python" "${GITHUB_WORKSPACE}/scripts/verify_sdk_install.py"
          "$streaming_consumer/bin/python" -m mypy --strict "${GITHUB_WORKSPACE}/scripts/verify_streaming_typing.py"

          batch_consumer="${RUNNER_TEMP}/jobstreaming-batch-consumer"
          python -m venv "$batch_consumer"
          "$batch_consumer/bin/python" -m pip install --disable-pip-version-check "${wheel[0]}[batch]"
          cd "$RUNNER_TEMP"
          "$batch_consumer/bin/python" "${GITHUB_WORKSPACE}/scripts/verify_batch_install.py"
